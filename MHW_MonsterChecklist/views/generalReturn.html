<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Bestiario Monster Hunter World</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/index.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Page header with logo and tagline-->

    <!--Main container to make the template-->
    <div class="container-fluid mainContainer px-0">
      {{>header}}
      <div style="margin-top: auto; margin-bottom: auto">
        <div
          class="container d-flex"
          style="flex-direction: column; align-items: center"
        >
          <p style="margin-top: auto; width: fit-content">{{message}}</p>
          <a
            class="btn btn-primary"
            href="{{destinationLink}}"
            style="margin-bottom: 20px; margin-top: auto"
            >Volver a {{destination}}</a
          >
        </div>
      </div>

      {{>footer}}
    </div>
  </body>
</html>
