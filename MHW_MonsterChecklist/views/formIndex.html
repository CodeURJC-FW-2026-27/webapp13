<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Monster Hunter World Checklist</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/styles.css" rel="stylesheet" />

    <link href="/css/form.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Page header with logo and tagline-->
    {{>header}}

    <!-- Page content-->
    <div class="container">
      <div class="row">
        <div class="col-md-8">
          <form
            method="post"
            action="./formManagerIndex"
            enctype="multipart/form-data"
          >
            <!-- Name -->
            <div class="form-group formDiv">
              <label for="formIndexName">Name</label>
              <input
                type="text"
                class="form-control"
                id="formIndexName"
                name="formIndexName"
                placeholder="Introduce el nombre de la zona"
              />
            </div>

            <!-- Difficulty -->
            <div class="form-group formDiv">
              <!-- A single choice selection to represent the difficulty of the zone,
                which will be saved as a number from 0 to 4, and then displayed as
                1 star, 2 stars, 3 stars, 4 stars or 5 stars in the list of hunting zones.
              -->
              <p class="formButtonLabel">Dificultad</p>

              <div
                class="row row-cols-lg-5 row-cols-md-2 row-cols-1"
                style="width: fit-content"
              >
                <div class="formContainerItem col">
                  <input
                    type="radio"
                    name="formIndexDifficulty"
                    value="1"
                    id="formIndexDifficultyButton0"
                  />
                  <label for="formIndexDifficultyButton0">⭐</label>
                </div>

                <div class="formContainerItem col">
                  <input
                    type="radio"
                    name="formIndexDifficulty"
                    value="2"
                    id="formIndexDifficultyButton2"
                  />
                  <label for="formIndexDifficultyButton2">⭐⭐</label>
                </div>

                <div class="formContainerItem col">
                  <input
                    type="radio"
                    name="formIndexDifficulty"
                    value="3"
                    id="formIndexDifficultyButton2"
                  />
                  <label for="formIndexDifficultyButton2">⭐⭐⭐</label>
                </div>

                <div class="formContainerItem col">
                  <input
                    type="radio"
                    name="formIndexDifficulty"
                    value="4"
                    id="formIndexDifficultyButton3"
                  />
                  <label for="formIndexDifficultyButton3">⭐⭐⭐⭐</label>
                </div>

                <div class="formContainerItem col">
                  <input
                    type="radio"
                    name="formIndexDifficulty"
                    value="5"
                    id="formIndexDifficultyButton4"
                  />
                  <label for="formIndexDifficultyButton4">⭐⭐⭐⭐⭐</label>
                </div>
              </div>
            </div>

            <!-- Ranks  -->
            <div class="form-group formDiv">
              <!-- Multiple choice selection (minimun 1)-->
              <p>Categorias</p>

              <div class="formContainerItem">
                <input
                  type="checkbox"
                  id="formIndexRank1"
                  name="formIndexRanks"
                  value="0"
                />
                <label for="formIndexRank1">Low Rank</label>
              </div>

              <div class="formContainerItem">
                <input
                  type="checkbox"
                  id="formIndexRank2"
                  name="formIndexRanks"
                  value="1"
                />
                <label for="formIndexRank2">High Rank</label>
              </div>

              <div class="formContainerItem">
                <input
                  type="checkbox"
                  id="formIndexRank3"
                  name="formIndexRanks"
                  value="2"
                />
                <label for="formIndexRank3">Master Rank</label>
              </div>
            </div>

            <!-- Image  -->
            <div class="form-group formDiv">
              <label for="formIndexImage formButtonLabel"
                >Imagen de la zona</label
              >
              <input
                type="file"
                name="formIndexImage"
                class="form-control"
                id="formIndexImage"
              />
            </div>

            <!-- Environment  -->
            <div class="form-group formDiv">
              <!-- A simple descriptive text for the environment and geographic zone
              -->
              <label for="formIndexEnviroment">Entorno</label>
              <input
                type="text"
                class="form-control"
                id="formIndexEnviroment"
                name="formIndexEnviroment"
                placeholder="Introduce el tipo de entorno de la zona (zona con volcanes, zona con pantano, zona montañosa, etc.)"
              />
            </div>

            <!-- Temperature  -->
            <div class="form-group formDiv">
              <p class="formButtonLabel">Temperatura</p>
              <!-- The values are saved in binary as 0,1,2 
                   and then they are processed and displayed as Frostbite, Temperate climate, Scorching.
              -->
              <div class="formContainerItem">
                <input
                  type="radio"
                  id="formIndexTemperature1"
                  name="formIndexTemperature"
                  value="0"
                />
                <label for="formIndexTemperature1">Frostbite</label>
              </div>

              <div class="formContainerItem">
                <input
                  type="radio"
                  id="formIndexTemperature2"
                  name="formIndexTemperature"
                  value="1"
                />
                <label for="formIndexTemperature2">Temperate climate</label>
              </div>

              <div class="formContainerItem">
                <input
                  type="radio"
                  id="formIndexTemperature3"
                  name="formIndexTemperature"
                  value="2"
                />
                <label for="formIndexTemperature3">Scorching</label>
              </div>
            </div>

            <!-- Description  -->
            <div class="form-group formDiv">
              <label for="formIndexDescription" class="formButtonLabel"
                >Descripcion del Entorno</label
              >
              <textarea
                class="form-control"
                id="formIndexDescription"
                name="formIndexDescription"
                placeholder="Una breve descripcion del entorno que has diseñado"
              ></textarea>
            </div>

            <div class="form-group formDiv">
              <button type="submit" class="btn btn-primary" id="">
                Guardar
              </button>
              <a class="btn btn-primary" href="index.html">Cancelar</a>
            </div>
          </form>
        </div>

        <div class="col-md-4">
          <!-- Preview box for the image and attributes of the hunting zone -->
          <div id="forumIndexPreviewBox">
            <!--
            <img
              src=""
              style="
                display: block;
                justify-content: end;
                width: 100%;
                height: auto;
              "
              alt="Preview"
            />
            -->
            Pequeño preview de como seria usando Javascript para cambiar la
            imagen y los atributos, pero no se ha implementado aun. Por ahora es
            solo un placeholder para ver como quedaria el diseño. Tendra una
            relacion de aspecto de 3x4
          </div>
        </div>
      </div>
    </div>

    <!-- Footer-->
    {{>footer}}
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="/js/scripts.js"></script>
  </body>
</html>
